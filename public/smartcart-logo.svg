<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Smart Gradient -->
    <linearGradient id="smartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="160" rx="25" fill="#F8FAFF"/>

  <!-- Cart Icon Group -->
  <g transform="translate(40,20)">

    <!-- Cart Body -->
    <rect x="0" y="40" width="140" height="45" rx="15"
          fill="none"
          stroke="url(#smartGradient)"
          stroke-width="4"
          filter="url(#softGlow)"/>

    <!-- Handle -->
    <line x1="0" y1="40" x2="-15" y2="25"
          stroke="url(#smartGradient)"
          stroke-width="4"
          stroke-linecap="round"
          filter="url(#softGlow)"/>

    <!-- Smile Curve -->
    <path d="M35 60 Q70 80 105 60"
          stroke="url(#smartGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <!-- Accent Dots -->
    <circle cx="25" cy="50" r="4" fill="#00C6FF"/>
    <circle cx="115" cy="50" r="4" fill="#7C3AED"/>

    <!-- Wheels -->
    <circle cx="35" cy="105" r="10"
            fill="none"
            stroke="url(#smartGradient)"
            stroke-width="4"
            filter="url(#softGlow)"/>
    <circle cx="115" cy="105" r="10"
            fill="none"
            stroke="url(#smartGradient)"
            stroke-width="4"
            filter="url(#softGlow)"/>

  </g>

  <!-- SmartCart Text on Right -->
  <text x="230" y="95"
        font-family="Poppins, Segoe UI, sans-serif"
        font-size="42"
        font-weight="700"
        fill="url(#smartGradient)">
    SmartCart
  </text>

</svg>